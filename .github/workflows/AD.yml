name: Enzyme smoke

on:
  push:
    branches:
      - main
    paths:
      - Project.toml
      - Manifest.toml
      - src/**
      - ext/**
      - test/ad/test_adapter_contract.jl
      - test/ad/test_enzyme_adapter.jl
      - test/runtests_ad_smoke.jl
      - test/Project.toml
      - .github/workflows/AD.yml
  pull_request:
    paths:
      - Project.toml
      - Manifest.toml
      - src/**
      - ext/**
      - test/ad/test_adapter_contract.jl
      - test/ad/test_enzyme_adapter.jl
      - test/runtests_ad_smoke.jl
      - test/Project.toml
      - .github/workflows/AD.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enzyme-smoke:
    name: Julia 1.10 - Enzyme smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10.10'
      - uses: julia-actions/cache@v2
        with:
          cache-compiled: false
          cache-scratchspaces: false
      - name: Instantiate AD test environment
        run: julia --startup-file=no --project=test -e 'using Pkg; Pkg.develop(Pkg.PackageSpec(path=".")); Pkg.instantiate()'
      - name: Run focused Enzyme smoke tests
        run: julia --startup-file=no --project=test test/runtests_ad_smoke.jl
