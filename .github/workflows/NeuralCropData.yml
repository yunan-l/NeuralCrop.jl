name: NeuralCropData

on:
  push:
    branches:
      - main
    paths:
      - lib/NeuralCropData/**
      - .github/workflows/NeuralCropData.yml
  pull_request:
    paths:
      - lib/NeuralCropData/**
      - .github/workflows/NeuralCropData.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Julia 1.10 - NeuralCropData
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
        with:
          cache-compiled: false
          cache-scratchspaces: false
      - name: Run NeuralCropData tests
        run: julia --startup-file=no --project=lib/NeuralCropData -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
