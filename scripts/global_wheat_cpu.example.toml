[paths]
input_directory = "/absolute/path/to/input_data"
hwsd_targets = "/absolute/path/to/hwsd_canonical.nc"
output_directory = "/absolute/path/to/global_wheat_output"

[climate]
# Relative paths are resolved below paths.input_directory/climate. Absolute
# paths are also accepted. These files provide both the 1901-1930 warm-up
# cycle and the 2015-2016 production forcing.
temperature_file = "tas_gswp3-w5e5_obsclim_1901-2019.nc"
precipitation_file = "pr_gswp3-w5e5_obsclim_1901-2019.nc"
longwave_file = "lwnet_gswp3-w5e5_obsclim_1901-2019.nc"
shortwave_file = "rsds_gswp3-w5e5_obsclim_1901-2019.nc"
co2_file = "global_co2_ann_1700_2022.txt"

[management]
# "fixed" repeats fixed_year; "transient" aligns each simulation year and
# repeats the first/last available management year outside the file range.
mode = "fixed"
fixed_year = 2015
fertilizer = "yes"
manure = true
with_tillage = true

[run]
backend = "cpu"
# Used by run_global_wheat_gpu.jl; Julia/CUDA device numbering starts at 0.
device_id = 0
memory_safety_factor = 1.2
simulation_start_year = 2015
simulation_end_year = 2016
# Repeat the first thirty climate years five times while keeping management
# fixed at 2015.
warmup_climate_start_year = 1901
warmup_climate_end_year = 1930
# Same-phase convergence compares year t with t-30. The fixed 150-year run
# completes five full thirty-year forcing cycles.
warmup_target_constrained = true
warmup_minimum_years = 150
warmup_maximum_years = 150
warmup_consecutive_years = 3
warmup_relative_tolerance = 0.01
warmup_pool_fraction_tolerance = 0.01
warmup_required_converged_fraction = 1.0
# Cache the thirty forcing years once to avoid repeated NetCDF reads. Enable only
# after memory_preflight.toml confirms sufficient host memory.
warmup_cache_climate = false
# Production runs stop before writing a warm-up checkpoint when convergence
# is not reached. Set false only for an explicitly diagnostic experiment.
require_warmup_convergence = true
diagnostic_cells = 10
# 0 runs every landfrac-selected cell; use a positive value only for smoke tests.
cell_limit = 0

[validation]
maximum_water_residual = 0.01
maximum_carbon_relative_residual = 0.0001
maximum_nitrogen_relative_residual = 0.0001
maximum_thermal_relative_residual = 0.0001
maximum_percolation_energy_residual = 5.0
# Relative tolerance for high-throughput cells; combined with the absolute
# tolerance above as `absolute + relative × boundary_enthalpy`.
maximum_percolation_energy_relative_residual = 5.0e-6
